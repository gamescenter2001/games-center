<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES CENTER - حاسبة عنق الزجاجة وتوافق العتاء</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* تنسيق القائمة المنسدلة للهاتف */
        .mobile-menu-container {
            position: relative;
            display: inline-block;
        }
        .menu-toggle-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background-color: #1a1f2c;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            border-radius: 8px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dropdown-menu a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            transition: background 0.2s;
        }
        .dropdown-menu a:hover {
            background-color: #2a3447;
            border-radius: 8px;
        }
        .dropdown-menu.show {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- هيدر الموقع -->
    <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <!-- شعار الموقع -->
        <a href="index.html" class="text-xl font-bold text-red-600 tracking-wider">ANKERGAMES</a>

        <!-- القائمة المنسدلة -->
        <div class="mobile-menu-container">
            <button onclick="toggleMenu()" class="menu-toggle-btn">
                <i class="fas fa-bars"></i>
            </button>
            <div id="dropdownMenu" class="dropdown-menu">
                <a href="games.html"><i class="fas fa-download ml-2"></i> تحميل الالعاب</a>
                <a href="index.html">الرئيسية</a>
            </div>
        </div>
    </header>

    <!-- محتوى الصفحة الرئيسي -->
    <main class="max-w-4xl mx-auto p-4">
        <div class="text-center py-6">
            <h1 class="text-2xl font-bold mb-2">GAMES CENTER</h1>
            <p class="text-slate-400 text-sm">حاسبة عنق الزجاجة وتوافق العتاد المتقدمة</p>
        </div>

        <!-- أضف بقية أقسام ومكونات الموقع هنا كما كانت -->
    </main>

    <!-- سكربت القائمة المنسدلة -->
    <script>
        function toggleMenu() {
            document.getElementById("dropdownMenu").classList.toggle("show");
        }

        // إغلاق القائمة عند النقر خارجها
        window.onclick = function(event) {
            if (!event.target.matches('.menu-toggle-btn') && !event.target.matches('.fa-bars')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
